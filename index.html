<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planeación Semestral RecSports</title>
    <link rel="stylesheet" href="./styles.css?v=20260623-export-planning" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">RecSports</p>
          <h1>Planeación Semestral</h1>
          <p class="subhead">Seguimiento colaborativo de actividades por área y mes.</p>
        </div>
        <div class="topbar-actions">
          <button class="form-link" id="captureButton" type="button">
            Capturar actividad
          </button>
          <button class="import-button" id="exportButton" type="button">Exportar Excel</button>
        </div>
      </header>
      <div class="import-status" id="importStatus" role="status" aria-live="polite"></div>

      <section class="capture-panel" id="capturePanel" aria-label="Captura de actividad" hidden>
        <div class="capture-panel-heading">
          <div>
            <p class="eyebrow">Nueva actividad</p>
            <h2>Capturar actividad</h2>
          </div>
          <button class="capture-close" id="captureClose" type="button" aria-label="Cerrar captura">×</button>
        </div>
        <form class="capture-form" id="captureForm">
          <label>
            Fecha específica
            <input id="captureDate" name="specificDate" type="date" required>
          </label>
          <label>
            Área
            <select id="captureArea" name="area" required></select>
          </label>
          <label class="capture-activity-field">
            Actividad
            <textarea id="captureActivity" name="activity" rows="3" required placeholder="Describe la actividad"></textarea>
          </label>
          <div class="capture-actions">
            <button class="capture-submit" type="submit">Guardar actividad</button>
            <button class="capture-secondary" id="captureCancel" type="button">Cancelar</button>
          </div>
        </form>
        <div class="capture-status" id="captureStatus" role="status" aria-live="polite"></div>
      </section>

      <section class="controls" aria-label="Filtros">
        <div class="period-tabs" aria-label="Periodos">
          <button class="period-tab" type="button" data-period="invierno">Invierno</button>
          <button class="period-tab" type="button" data-period="feb-jun">Feb-Jun</button>
          <button class="period-tab" type="button" data-period="verano">Verano</button>
          <button class="period-tab" type="button" data-period="ago-dic">Ago-Dic</button>
        </div>
        <label>
          Área
          <select id="areaFilter"></select>
        </label>
        <label>
          Mes
          <select id="monthFilter"></select>
        </label>
        <button id="resetFilters" type="button">Limpiar filtros</button>
      </section>

      <section class="board-wrap" aria-label="Matriz de planeación">
        <div class="board" id="planningBoard"></div>
      </section>

      <section class="activity-panel" aria-label="Lista de actividades">
        <div class="section-heading">
          <div>
            <p class="eyebrow" id="summaryEyebrow">Semana actual</p>
            <h2 id="summaryTitle">Resumen semana actual</h2>
          </div>
          <span id="lastUpdated">Actualizado localmente</span>
        </div>
        <div class="activity-list" id="activityList"></div>
      </section>
    </main>

    <script src="./app.js?v=20260623-export-planning"></script>
  </body>
</html>
