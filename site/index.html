    <script>
      (() => {
        const currentVersion = "20261026-vivencia-elapsed-events-v2";
        let checkingVersion = false;

        async function ensureLatestWellSync() {
          if (checkingVersion) return;
          checkingVersion = true;
          try {
            const response = await fetch(`./index.html?fresh=${Date.now()}`, { cache: "no-store" });
            const html = await response.text();
            const publishedVersion = html.match(/name=["']wellsync-version["']\s+content=["']([^"']+)/i)?.[1];
            if (publishedVersion && publishedVersion !== currentVersion) {
              const url = new URL(window.location.href);
              url.searchParams.set("v", publishedVersion);
              window.location.replace(url.toString());
            }
          } catch (error) {
            console.warn("No se pudo comprobar la version publicada de WellSync", error);
          } finally {
            checkingVersion = false;
          }
        }

        window.addEventListener("pageshow", (event) => {
          if (event.persisted) ensureLatestWellSync();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") ensureLatestWellSync();
        });
        window.setTimeout(ensureLatestWellSync, 1200);
      })();
    </script>

    <script>
      window.WellSyncAssets = (() => {
        const pending = new Map();
        const loadScript = (key, src, ready) => {
          if (ready()) return Promise.resolve();
          if (pending.has(key)) return pending.get(key);
          const request = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.async = true;
            script.onload = () => ready() ? resolve() : reject(new Error(`El recurso ${key} no quedó disponible`));
            script.onerror = () => reject(new Error(`No se pudo cargar ${key}`));
            document.head.appendChild(script);
          }).catch((error) => {
            pending.delete(key);
            throw error;
          });
          pending.set(key, request);
          return request;
        };
        return {
          ensureSpreadsheet: () => loadScript(
            "xlsx",
            "./assets/vendor/xlsx.mini.min.js?v=0.18.5",
            () => Boolean(window.XLSX)
          )
        };
      })();
    </script>

    <script>
      (() => {
        const completeWellnessTransferTime = () => {
          document.querySelectorAll(".exec-insight-vivencia-history strong").forEach((label) => {
            if (label.textContent.trim().toLowerCase() === "transferencia 2:00 a 4:30") {
              label.textContent = "Transferencia 2:00 a 4:30 p. m.";
            }
          });
          const vivenciaCard = Array.from(document.querySelectorAll(".exec-report-hero li"))
            .find((card) => card.querySelector("span")?.textContent.trim() === "Vivencia");
          const value = vivenciaCard?.querySelector("strong");
          const detail = vivenciaCard?.querySelector("em");
          const legacyDetail = detail?.textContent.trim().match(/^eventos\s*·\s*([\d.,]+)\s+participaciones$/i);
          if (value && detail && legacyDetail) {
            const eventCount = value.textContent.trim();
            value.textContent = legacyDetail[1];
            detail.textContent = `participaciones · ${eventCount} eventos`;
          }
        };
        const reportRoot = document.getElementById("contentArea");
        if (reportRoot) new MutationObserver(completeWellnessTransferTime).observe(reportRoot, { childList: true, subtree: true });
        window.addEventListener("beforeprint", completeWellnessTransferTime);
        completeWellnessTransferTime();
      })();
